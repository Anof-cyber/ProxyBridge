name: Build ProxyBridge

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: self-hosted

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Build project
      run: .\compile.ps1 -Compiler gcc
      shell: pwsh

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ProxyBridge-Build-${{ github.sha }}
        path: output/
        retention-days: 30

    - name: Upload Installer
      uses: actions/upload-artifact@v4
      with:
        name: ProxyBridge-Installer
        path: output/ProxyBridge-Setup-*.exe
        retention-days: 90
        if-no-files-found: warn

    - name: List output files
      run: |
        Write-Host "`nBuild artifacts:"
        Get-ChildItem output -Recurse | ForEach-Object {
          $size = [math]::Round($_.Length/1MB, 2)
          Write-Host "  $($_.Name) - $size MB"
        }
      shell: pwsh

